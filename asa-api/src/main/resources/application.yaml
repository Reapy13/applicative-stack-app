spring:

    # Datasource
    datasource:
        url: jdbc:h2:mem:appdb
        driverClassName: org.h2.Driver

    # JPA
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: update

    # Liquibase
    liquibase:
        change-log: classpath:/db/liquibase/changelog/master.yaml